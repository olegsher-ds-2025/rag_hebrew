line-length = 110
target-version = "py310"

[lint]
# E/F: pycodestyle+pyflakes, I: import order, B: bugbear, UP: pyupgrade
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",  # long lines: Hebrew strings/regexes read better unwrapped
]

[lint.per-file-ignores]
"scripts/*" = ["E402"]  # sys.path bootstrap before imports
"api/app.py" = ["E402"]
