version: '3.8'
services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./vector_store:/app/vector_store
      - ./indexdir:/app/indexdir
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_URL=http://10.0.0.20:11434/api/generate

