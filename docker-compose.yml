version: '3.8'
services:
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # For NVIDIA GPU support, uncomment:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./vector_store:/app/vector_store
      - ./indexdir:/app/indexdir
    restart: unless-stopped
    depends_on:
      - ollama
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_URL=http://ollama:11434/api/generate

volumes:
  ollama_data:
